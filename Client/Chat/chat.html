<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Sign Up Page</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
    </head>
    <body>
        <nav class="navbar navbar-expand-lg bg-success">
            <div class="container-fluid">
                <div class="navbar-brand text-light">Chat Together</div>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active text-light" aria-current="page" href="../index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <div role="button" class="nav-link text-light" onclick="logOut()">Logout</div>
                    </li>
                    <li class="nav-item userStatus">
                    </li>
                    <li class="nav-item dropdown showMembers d-none">
                        <div class="nav-link dropdown-toggle text-light" data-bs-toggle="dropdown" >
                            Members
                        </div>
                        <ul class="dropdown-menu bg-success groupMembers">
                        </ul>
                    </li>
                </ul>
                </div>
            </div>
        </nav>
        <div class="container-fluid p-0">

        <!-- Chat Page -->
        <div class="d-flex flex-column bg-white"
            style="height: 90vh;">

            <!-- Chat Messages -->
            <div class="chatPage flex-grow-1 overflow-auto p-3 bg-light">
            </div>

            <!-- Message Input -->
            <div class="border-top bg-white p-3 d-block"> 
                <div class="d-none align-items-center gap-2 justify-content-between mb-3 expandedChat">
                    <img class="imageToUpload" src="/public/icon/folder.png" width="35px" alt="">
                    <div class="d-flex gap-3">

                        <div class="d-none form-control AIText">
                            Hello Hi there , How you are doing
                        </div>
                        <div class="d-none suggestionText1 p-2 border">
                            Polite
                        </div>
    
                        <div class="d-none suggestionText2 p-2 border">
                            Formal
                        </div>
    
                        <div class="d-none suggestionText3 p-2 border">
                            Shorten
                        </div>

                        <button class="btn btn-outline-success text-nowrap AskAI d-block">
                            Ask AI
                        </button>

                        <button class="d-none btn btn-outline-success text-nowrap changeText">
                            Change
                        </button>
                    </div>
                </div>

                <form id="sendMessage" class="d-flex align-items-center gap-2">

                    <button type="button" class="btn border expandChat">
                        +
                    </button>
                    <input type="file" accept="image/*,video/*,.pdf,.doc,.docx" id="uploadImage" name="chatImage" class="d-none" >
                    <input type="text"
                        name="sendMessage"
                        class="form-control rounded-pill textMessage"
                        placeholder="Type a message...">

                    <button type="submit"
                            class="btn btn-success rounded-pill">
                        Send
                    </button>

                </form>
            </div>

        </div>

    </div>
    </body>
    <script src="index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" ></script>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.20.0/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/socket.io-client@4.8.4/dist/socket.io.min.js"></script>
</html>
