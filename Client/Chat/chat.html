<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Sign Up Page</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
    </head>
    <body>
        <nav class="navbar navbar-expand-lg bg-success">
            <div class="container-fluid">
                <a class="navbar-brand text-light" href="#">Chat Together</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active text-light" aria-current="page" href="#">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active text-light" aria-current="page" href="#">Logout</a>
                    </li>
                </ul>
                <form class="d-flex" role="search">
                    <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
                    <button class="btn btn-outline-light" type="submit">Search</button>
                </form>
                </div>
            </div>
        </nav>
        <div class="container-fluid p-0">

        <!-- Chat Page -->
        <div class="d-flex flex-column bg-white"
            style="height: 90vh;">

            <!-- Chat Messages -->
            <div class="flex-grow-1 overflow-auto p-3 bg-light">

                <div class="text-center mb-4">
                    <span class="badge bg-secondary">
                        Today
                    </span>
                </div>

                <!-- Received Message -->
                <div class="d-flex mb-3">
                    <div class="bg-white border rounded-3 p-3 shadow-sm"
                        style="max-width: 80%;">
                        <div>Hello! How are you?</div>
                        <div class="text-muted text-end mt-1">
                            <small>10:30 AM</small>
                        </div>
                    </div>
                </div>

                <!-- Sent Message -->
                <div class="d-flex justify-content-end mb-3">
                    <div class="bg-success text-white rounded-3 p-3"
                        style="max-width: 80%;">
                        <div>I'm good! What about you?</div>
                        <div class="text-white-50 text-end mt-1">
                            <small>10:31 AM ✓✓</small>
                        </div>
                    </div>
                </div>

                <!-- Received Message -->
                <div class="d-flex mb-3">
                    <div class="bg-white border rounded-3 p-3 shadow-sm"
                        style="max-width: 80%;">
                        <div>Doing great. Are we meeting today?</div>
                        <div class="text-muted text-end mt-1">
                            <small>10:32 AM</small>
                        </div>
                    </div>
                </div>

                <!-- Sent Message -->
                <div class="d-flex justify-content-end mb-3">
                    <div class="bg-success text-white rounded-3 p-3"
                        style="max-width: 80%;">
                        <div>Yes, let's meet at 3 PM.</div>
                        <div class="text-white-50 text-end mt-1">
                            <small>10:33 AM ✓✓</small>
                        </div>
                    </div>
                </div>

                <!-- Received Message -->
                <div class="d-flex mb-3">
                    <div class="bg-white border rounded-3 p-3 shadow-sm"
                        style="max-width: 80%;">
                        <div>Perfect! See you then.</div>
                        <div class="text-muted text-end mt-1">
                            <small>10:34 AM</small>
                        </div>
                    </div>
                </div>

            </div>

            <!-- Message Input -->
            <div class="border-top bg-white p-3">
                <form class="d-flex align-items-center gap-2">

                    <button type="button" class="btn btn-light border">
                        +
                    </button>

                    <input type="text"
                        class="form-control rounded-pill"
                        placeholder="Type a message...">

                    <button type="submit"
                            class="btn btn-success rounded-pill">
                        Send
                    </button>

                </form>
            </div>

        </div>

    </div>
    </body>
    <script src="index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" ></script>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.20.0/dist/axios.min.js"></script>
</html>
