<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In Page</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-success">
        <div class="container-fluid">
            <a class="navbar-brand text-light fw-bold" href="#">Chat Together</a>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="fw-medium fs-3 mb-4">Login Now - Hurry Up</div>
        <form onsubmit="HandleSignIn()">
            <div class="mb-3">
                <label for="Email" class="form-label">Email</label>
                <input type="email" required class="form-control" id="Email">
            </div>
            <div class="mb-3">
                <label for="PhoneNumber" class="form-label">Phone Number</label>
                <input type="tel" required class="form-control" id="PhoneNumber">
            </div>
            <div class="mb-3">
                <label for="Password" class="form-label">Password</label>
                <input type="password" required class="form-control" id="Password">
                <a class="text-decoration-none" href="./signUp.html">Didn't have an account - create one from here</a>
            </div>
            <div class=" d-flex gap-2">
                <button type="submit" class="btn fw-medium btn-outline-success">Login</button>
                <button type="button" class="btn fw-medium btn-outline-danger">Forget Password</button>
            </div>
        </form>
    </div>
</body>
<script src="index.js" ></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" ></script>
</html>
