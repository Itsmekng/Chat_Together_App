<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Sign Up Page</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
    </head>
    <body>
        <nav class="navbar navbar-expand-lg bg-success">
            <div class="container-fluid">
                <a class="navbar-brand text-light" href="#">Chat Together</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <div role="button" class="nav-link text-light" onclick="logOut()">Logout</div>
                    </li>
                </ul>
                <button type="button" class="btn btn-outline-light" data-bs-toggle="modal" data-bs-target="#exampleModal">Start Connection</button>
                </div>
            </div>
        </nav>
        <div class="container-fluid p-0">
            <div class="row g-0 border rounded overflow-hidden"
                style="min-height: 85vh;">

                <!-- 1. ALL CHATS -->
                <div class="col-12 col-md-4 col-lg-4 border-end bg-white">

                    <div class="p-3 border-bottom">
                        <h6 class="mb-0">All Chats</h6>
                        <small class="text-muted">Personal conversations</small>
                    </div>

                    <div class="list-group allChatMessage list-group-flush">
                    </div>
                </div>

                <!-- 2. GROUPS -->
                <div class="col-12 col-md-4 col-lg-4 border-end bg-white">

                    <div class="p-3 border-bottom">
                        <h6 class="mb-0">Groups</h6>
                        <small class="text-muted">Group conversations</small>
                    </div>

                    <div class="list-group list-group-flush allChatGroupMessage">
                    </div>
                </div>

                <!-- 3. BROADCAST -->
                <div class="col-12 col-md-4 col-lg-4 bg-white">

                    <div class="p-3 border-bottom">
                        <h6 class="mb-0">Broadcast</h6>
                        <small class="text-muted">Broadcast conversations</small>
                    </div>

                    <div class="list-group list-group-flush">
                    </div>
                </div>
            </div>
        </div>
        <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-body">
                        <form onsubmit="searchUser(event)">
                            <div class="mb-3 personalChat d-block">
                                <label for="userNumber" class="form-label">User Number</label>
                                <input type="number" class="form-control" id="userNumber">
                                <div id="userNotExistError" class="text-danger fs-6 d-none">User not exist with this number !</div>
                            </div>
                            <div class="mb-3">
                                <select name="chatOption" class="form-select chatType">
                                    <option selected value="personalChat">Personal Chat</option>
                                    <option value="group">Group Chat</option>
                                </select>
                            </div>
                            <div class="mb-3 d-none chatGroup">
                                <label for="groupName" class="form-label">Group Name</label>
                                <input type="text" class="form-control" name="groupName" id="groupName">
                            </div>
                            <div class="mb-3 d-none groupChat">
                                <label for="addUser" class="form-label">Add User</label>
                                <input type="number" class="form-control" id="addUser">
                                <ul class="groupUser list-unstyled text-nowrap d-flex mt-1 overflow-auto">
                                </ul>
                            </div>
                            <button type="button" class="btn btn-success d-none addUserbtn">Add</button>
                            <button type="submit" class="btn btn-success">Submit</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </body>
    <script src="index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" ></script>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.20.0/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/socket.io-client@4.8.4/dist/socket.io.min.js"></script>
</html>
